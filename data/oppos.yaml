# Noms de référence des decks adverses (oppo) et leurs variantes acceptées, communs à tous les tournois.
# À l'import, toute variante saisie dans l'inbox est remplacée par le nom de référence :
# les stats de matchup comptent ainsi un même deck sous un seul nom.
#
# Format : le nom de référence (nom court du commandant), puis la liste de ses variantes.
# Nom de référence avec "/" pour les duos de partenaires, ex. Tymna/Thrasios.
#
# Pour ajouter un deck : son nom de référence suivi de « : », puis une ligne « - variante » par façon de l'écrire.
# Les majuscules et les espaces en trop sont ignorés à la comparaison.

Ragavan:
    - Ragavan, Nimble Pilferer
    - raga
Kess:
    - Kess, Dissident Mage
Tymna/Thrasios:
    - Tymna Thrasios
    - Thrasios/Tymna
    - Tymna the Weaver
    - Thrasios, Triton Hero
